<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb3e8"/>
      <stop offset="1" stop-color="#cfe6f7"/>
    </linearGradient>
    <!-- One isometric block: top, left and right faces, 80px edge. -->
    <g id="grass">
      <path d="M0 0 L69.3 40 L0 80 L-69.3 40 Z" fill="#6fbf4a"/>
      <path d="M-69.3 40 L0 80 L0 160 L-69.3 120 Z" fill="#8a5a36"/>
      <path d="M0 80 L69.3 40 L69.3 120 L0 160 Z" fill="#6e4528"/>
      <path d="M-69.3 40 L0 80 L0 96 L-69.3 56 Z" fill="#5aa23a"/>
      <path d="M0 80 L69.3 40 L69.3 56 L0 96 Z" fill="#4b8a30"/>
    </g>
    <g id="dirt">
      <path d="M0 0 L69.3 40 L0 80 L-69.3 40 Z" fill="#a0703f"/>
      <path d="M-69.3 40 L0 80 L0 160 L-69.3 120 Z" fill="#8a5a36"/>
      <path d="M0 80 L69.3 40 L69.3 120 L0 160 Z" fill="#6e4528"/>
    </g>
    <g id="wood">
      <path d="M0 0 L69.3 40 L0 80 L-69.3 40 Z" fill="#b08a55"/>
      <path d="M-69.3 40 L0 80 L0 160 L-69.3 120 Z" fill="#7a5530"/>
      <path d="M0 80 L69.3 40 L69.3 120 L0 160 Z" fill="#5f4124"/>
    </g>
    <g id="leaf">
      <path d="M0 0 L69.3 40 L0 80 L-69.3 40 Z" fill="#4fa83a"/>
      <path d="M-69.3 40 L0 80 L0 160 L-69.3 120 Z" fill="#3e8a2e"/>
      <path d="M0 80 L69.3 40 L69.3 120 L0 160 Z" fill="#326f25"/>
    </g>
  </defs>
  <rect width="1000" height="1000" fill="url(#sky)"/>
  <g transform="translate(0 170)">
  <!-- Back row first so nearer blocks overlap it. -->
  <use href="#grass" x="500" y="300"/>
  <!-- A small tree on the back block, drawn before the nearer rows. -->
  <use href="#wood" x="500" y="220"/>
  <use href="#wood" x="500" y="140"/>
  <use href="#leaf" x="430.7" y="100"/>
  <use href="#leaf" x="569.3" y="100"/>
  <use href="#leaf" x="500" y="60"/>
  <use href="#leaf" x="500" y="-20"/>
  <use href="#grass" x="430.7" y="340"/>
  <use href="#grass" x="569.3" y="340"/>
  <use href="#grass" x="361.4" y="380"/>
  <use href="#grass" x="500" y="380"/>
  <use href="#grass" x="638.6" y="380"/>
  <use href="#grass" x="292.1" y="420"/>
  <use href="#grass" x="430.7" y="420"/>
  <use href="#grass" x="569.3" y="420"/>
  <use href="#grass" x="707.9" y="420"/>
  <use href="#dirt" x="361.4" y="460"/>
  <use href="#grass" x="500" y="460"/>
  <use href="#dirt" x="638.6" y="460"/>
  <use href="#grass" x="430.7" y="500"/>
  <use href="#grass" x="569.3" y="500"/>
  <use href="#grass" x="500" y="540"/>
  </g>
</svg>
